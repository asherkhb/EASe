<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In - EASe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md px-4">
    <!-- Logo/Header -->
    <div class="text-center mb-8">
      <div class="inline-flex h-14 w-14 items-center justify-center rounded-xl bg-slate-900 text-white mb-4">
        <svg aria-hidden="true" viewBox="0 0 48 48" class="h-8 w-8">
          <path fill="currentColor" d="M6 12h18v6H6zM6 24h30v6H6zM6 36h24v6H6z" />
        </svg>
      </div>
      <p class="text-[10px] uppercase tracking-[0.3em] text-slate-500">Elastic Application ServicE</p>
      <h1 class="text-2xl font-semibold text-slate-900 mt-1">Sign in to EASe</h1>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      {{if .Error}}
      <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
        {{.Error}}
      </div>
      {{end}}

      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1">
            Username
          </label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            value="{{.Username}}"
            autocomplete="username"
            required
            class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-shadow"
            placeholder="Enter your username"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
            Password
          </label>
          <input 
            type="password" 
            id="password" 
            name="password"
            autocomplete="current-password"
            required
            class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-shadow"
            placeholder="Enter your password"
          />
        </div>

        <button 
          type="submit"
          class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2"
        >
          Sign in
        </button>
      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-500 mt-6">
      EASe - Elastic Application ServicE
    </p>
  </div>
</body>
</html>
